<!doctype html><html lang="pt-BR"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><meta name="theme-color" content="#101827"><title>Orçamento Elétrica Japão V4</title><style>*{box-sizing:border-box}html{font-size:16px}body{margin:0;background:#101827;color:#f3f7ff;font-family:-apple-system,BlinkMacSystemFont,"Noto Sans",system-ui,sans-serif;overflow-wrap:anywhere}.wrap{width:100%;max-width:800px;margin:auto;padding:16px max(14px,env(safe-area-inset-right)) 40px max(14px,env(safe-area-inset-left))}h1{font-size:clamp(1.35rem,5vw,1.85rem);color:#71e4d0;line-height:1.3}h2{font-size:1.16rem;color:#71e4d0;margin:0 0 12px}p{line-height:1.55}.toolbar{display:flex;flex-wrap:wrap;gap:8px;justify-content:flex-end}button{border:0;border-radius:10px;padding:12px 14px;font:inherit;font-weight:700;background:#71e4d0;color:#10202c;cursor:pointer;min-height:44px}button.alt{background:#304158;color:white;border:1px solid #62758c}button[aria-pressed=true]{outline:2px solid #71e4d0}button.remove{background:#663b48;color:white;padding:8px 12px}.card{background:#1d2a3d;border:1px solid #354960;border-radius:14px;padding:16px;margin:16px 0;min-width:0}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.field{display:block;min-width:0}.field span{display:block;font-size:.93rem;font-weight:650;line-height:1.4;margin-bottom:7px;color:#edf5ff}.field input,.field select{width:100%;max-width:100%;min-width:0;background:#111d2d;color:white;border:1px solid #7b8da5;border-radius:9px;padding:12px;font-size:16px;min-height:46px;appearance:none}.hint{font-size:.83rem;color:#c4d1df;margin:7px 0 0}.worker{border:1px solid #52657d;border-radius:12px;padding:12px;margin:10px 0}.worker-head{display:flex;justify-content:space-between;align-items:center;gap:10px;margin-bottom:10px}.worker-head strong{color:#d4f9f1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:14px}.results{background:#17382f;border-color:#377f68}.result-row{display:flex;justify-content:space-between;gap:10px;align-items:flex-start;padding:9px 0;border-bottom:1px solid #416457}.result-row span{flex:1;min-width:0}.result-row strong{text-align:right;white-space:nowrap}.total{font-size:1.35rem;color:#8ff7d3}.note{font-size:.84rem;color:#cbd7e5;line-height:1.65}@media(max-width:600px){.wrap{padding:12px 12px 36px}.card{padding:13px;margin:12px 0}.grid{grid-template-columns:1fr}.toolbar{justify-content:stretch}.toolbar button{flex:1;min-width:0;padding:10px 6px;font-size:.91rem}.result-row{font-size:.91rem}.total{font-size:1.1rem}}@media(min-width:601px){.worker .grid{grid-template-columns:repeat(3,minmax(0,1fr))}}.field select{width:100%;background:#111d2d;color:white;border:1px solid #7b8da5;border-radius:9px;padding:12px;font-size:16px;min-height:46px}.field input[type=text]{font-size:16px}@media print{body{background:white;color:black}.card{background:white;color:black;border:1px solid #888}.toolbar,.actions,.remove{display:none!important}.field span,h1,h2,.hint,.note{color:black!important}.field input,.field select{color:black;background:white;border:1px solid #aaa}.results{background:white}.result-row{border-color:#aaa}} </style></head><body><main class="wrap"><div class="toolbar"><button id="pt" class="alt" onclick="setLang('pt')" aria-pressed="true">🇧🇷 Português</button><button id="ja" class="alt" onclick="setLang('ja')" aria-pressed="false">🇯🇵 日本語</button></div><h1 data-i="title"></h1><p data-i="subtitle"></p><section class="card"><h2 data-i="work"></h2><div class="grid"><label class="field"><span data-i="siteName"></span><input id="siteName" type="text" placeholder=""></label><label class="field"><span data-i="siteAddress"></span><input id="siteAddress" type="text"></label><label class="field"><span data-i="clientCompany"></span><input id="clientCompany" type="text"></label><label class="field"><span data-i="primeCompany"></span><input id="primeCompany" type="text"></label><label class="field"><span data-i="executorCompany"></span><input id="executorCompany" type="text"></label><label class="field"><span data-i="siteManager"></span><input id="siteManager" type="text"></label><label class="field"><span data-i="days"></span><input id="days" type="number" inputmode="decimal" min="0" step="0.5" value="3"></label><label class="field"><span data-i="materials"></span><input id="materials" type="number" inputmode="decimal" min="0" value="30000"></label></div></section><section class="card"><h2 data-i="people"></h2><p class="hint" data-i="peopleHint"></p><div id="workers"></div><button onclick="addWorker()" data-i="addWorker"></button></section><section class="card"><h2 data-i="dailyTitle"></h2><p class="hint" data-i="dailyHint"></p><div class="grid"><label class="field"><span data-i="toll"></span><input id="toll" type="number" inputmode="decimal" min="0" value="2000"></label><label class="field"><span data-i="parking"></span><input id="parking" type="number" inputmode="decimal" min="0" value="1500"></label><label class="field"><span data-i="fuel"></span><input id="fuel" type="number" inputmode="decimal" min="0" value="1000"></label><label class="field"><span data-i="otherDaily"></span><input id="otherDaily" type="number" inputmode="decimal" min="0" value="0"></label></div></section><section class="card"><h2 data-i="extras"></h2><div class="grid"><label class="field"><span data-i="fixed"></span><input id="fixed" type="number" inputmode="decimal" min="0" value="10000"></label><label class="field"><span data-i="margin"></span><input id="margin" type="number" inputmode="decimal" min="0" max="99" value="25"></label><label class="field"><span data-i="tax"></span><input id="tax" type="number" inputmode="decimal" min="0" max="100" value="10"></label></div></section><div class="actions"><button onclick="calc()" data-i="calculate"></button><button class="alt" onclick="window.print()" data-i="print"></button></div><section class="card results" aria-live="polite"><h2 data-i="results"></h2><div id="output"></div></section><p class="note" data-i="workerHintTax"></p><p class="note" data-i="disclaimer"></p></main><script>
const D={pt:{title:'⚡ Orçamento Elétrico — Japão',subtitle:'Versão 4 • equipes, prestadores e dados da obra',work:'📋 Dados da obra',days:'Dias de trabalho',materials:'Materiais — total (¥)',people:'👷 Profissionais',peopleHint:'Defina quantidade e diária para cada tipo de profissional. Ex.: eletricista e ajudante.',worker:'Profissional',role:'Função / identificação',qty:'Quantidade',rate:'Diária por pessoa (¥)',addWorker:'＋ Adicionar profissional',remove:'Remover',dailyTitle:'🚗 Despesas por dia',dailyHint:'Informe o custo diário TOTAL da equipe/obra, não por pessoa. Multiplicamos automaticamente pelos dias.',toll:'Kōsoku / pedágio por dia (¥)',parking:'Estacionamento por dia (¥)',fuel:'Gasolina por dia (¥)',otherDaily:'Outras despesas por dia (¥)',extras:'💰 Ajustes do orçamento',fixed:'Despesas únicas / fixas (¥)',margin:'Margem de lucro (%)',tax:'Imposto sobre consumo (%)',calculate:'Recalcular',print:'Imprimir / salvar PDF',results:'📊 Resultado',labor:'Mão de obra',daily:'Despesas diárias × dias',materialsResult:'Materiais',fixedResult:'Despesas fixas',cost:'Custo total',before:'Preço sem imposto',profit:'Lucro bruto estimado',taxResult:'Imposto estimado',total:'TOTAL AO CLIENTE',error:'Verifique os valores: todos devem ser não negativos; quantidades inteiras; margem menor que 100%; imposto até 100%.',disclaimer:'Estimativa comercial. Margem é calculada sobre o preço de venda sem imposto, não como acréscimo sobre o custo. O imposto é uma simulação configurável, não uma determinação fiscal. Não inclui encargos trabalhistas, seguros ou tributos específicos não informados. Revise antes de enviar ao cliente.',siteName:'Nome do gemba',siteAddress:'Endereço da obra',clientCompany:'Empresa que contratou o serviço (発注元)',primeCompany:'Empreiteira principal (元請)',executorCompany:'Empresa executora (施工会社)',siteManager:'Responsável pelo gemba',category:'Tipo de profissional',employee:'Funcionário',solo:'Hitori oyakata (autônomo)',outsourced:'Empresa / terceirizado',workerDays:'Dias deste profissional',taxMode:'Valor contratado',taxExclusive:'Sem imposto (adicionar taxa)',taxInclusive:'Com imposto incluído',taxNone:'Sem imposto na contratação',contractTax:'Imposto sobre contratação (%)',invoice:'Registro Invoice',registered:'Registrado',unregistered:'Não registrado',unknown:'Não informado',laborEmployee:'Funcionários',laborOutsource:'Autônomos e terceirizados',taxContract:'Imposto incluído nos custos de terceiros',workerHintTax:'O imposto da contratação é separado do imposto cobrado ao cliente. Registro Invoice não determina automaticamente o crédito fiscal.',defaultRole:'Eletricista',defaultRole2:'Ajudante'},ja:{title:'⚡ 電気工事 見積シミュレーター',subtitle:'バージョン4 • 外注費・現場情報対応',work:'📋 工事情報',days:'作業日数',materials:'材料費（工事全体・円）',people:'👷 作業員',peopleHint:'職種ごとに人数と1人あたりの日当を入力してください。例：電工・手元作業員。',worker:'作業員区分',role:'職種・名称',qty:'人数',rate:'1人あたりの日当（円）',addWorker:'＋ 作業員区分を追加',remove:'削除',dailyTitle:'🚗 1日あたりの経費',dailyHint:'1人分ではなく、現場全体の1日あたりの金額を入力してください。作業日数を自動で掛けます。',toll:'高速道路料金／日（円）',parking:'駐車場代／日（円）',fuel:'ガソリン代／日（円）',otherDaily:'その他の日額経費（円）',extras:'💰 見積設定',fixed:'一時的・固定経費（円）',margin:'希望粗利益率（％）',tax:'消費税率（％）',calculate:'再計算',print:'印刷／PDF保存',results:'📊 計算結果',labor:'人件費',daily:'日額経費 × 作業日数',materialsResult:'材料費',fixedResult:'固定経費',cost:'総原価',before:'税抜見積金額',profit:'見込粗利益',taxResult:'消費税（概算）',total:'税込見積金額',error:'入力値をご確認ください。金額は0以上、人数は整数、粗利益率は100％未満、消費税率は100％以下にしてください。',disclaimer:'概算見積です。粗利益率は税抜売価に対する割合で、原価への上乗せ率ではありません。消費税は設定値による参考計算で、税務上の判断ではありません。社会保険料・保険料・個別の税負担等は含まれません。提出前に内容をご確認ください。',siteName:'現場名',siteAddress:'現場住所',clientCompany:'発注元会社名',primeCompany:'元請会社名',executorCompany:'施工会社名',siteManager:'現場責任者',category:'契約区分',employee:'従業員',solo:'一人親方',outsourced:'外注業者',workerDays:'この作業員の稼働日数',taxMode:'契約金額の扱い',taxExclusive:'税抜（税率を加算）',taxInclusive:'税込',taxNone:'消費税を加算しない',contractTax:'外注消費税率（％）',invoice:'インボイス登録',registered:'登録あり',unregistered:'登録なし',unknown:'未確認',laborEmployee:'従業員人件費',laborOutsource:'一人親方・外注費',taxContract:'外注費に含まれる消費税（参考）',workerHintTax:'仕入先の消費税と顧客への消費税は別計算です。インボイス登録だけで仕入税額控除は自動判定できません。',defaultRole:'電工',defaultRole2:'手元作業員'}};
let lang='pt',nextId=0;const workers=[];const yen=n=>new Intl.NumberFormat('ja-JP',{style:'currency',currency:'JPY',maximumFractionDigits:0}).format(Math.round(n));const val=id=>Number(document.getElementById(id).value);function addWorker(role='',qty=1,rate=18000){workers.push({id:nextId++,role,qty,rate,category:'employee',workerDays:'',taxMode:'exclusive',contractTax:10,invoice:'unknown'});renderWorkers();calc()}function removeWorker(id){if(workers.length<=1)return;const ix=workers.findIndex(w=>w.id===id);if(ix>=0)workers.splice(ix,1);renderWorkers();calc()}function updateWorker(id,key,value){const w=workers.find(w=>w.id===id);if(!w)return;w[key]=value;calc()}function renderWorkers(){const root=document.getElementById('workers');root.replaceChildren();workers.forEach((w,index)=>{const box=document.createElement('div');box.className='worker';const head=document.createElement('div');head.className='worker-head';const title=document.createElement('strong');title.textContent=`${D[lang].worker} ${index+1}`;head.append(title);if(workers.length>1){const del=document.createElement('button');del.className='remove';del.textContent=D[lang].remove;del.onclick=()=>removeWorker(w.id);head.append(del)}box.append(head);const grid=document.createElement('div');grid.className='grid';for(const [key,label,type] of [['role',D[lang].role,'text'],['qty',D[lang].qty,'number'],['rate',D[lang].rate,'number'],['workerDays',D[lang].workerDays,'number'],['contractTax',D[lang].contractTax,'number']]){const field=document.createElement('label');field.className='field';const span=document.createElement('span');span.textContent=label;const input=document.createElement('input');input.type=type;input.value=w[key];if(key==='workerDays')input.placeholder=String(document.getElementById('days').value);if(type==='number'){input.min=0;input.inputMode='decimal';if(key==='qty')input.step='1'}input.addEventListener('input',()=>updateWorker(w.id,key,input.value));field.append(span,input);grid.append(field)}for(const [key,label,opts] of [['category',D[lang].category,[['employee',D[lang].employee],['solo',D[lang].solo],['outsourced',D[lang].outsourced]]],['taxMode',D[lang].taxMode,[['exclusive',D[lang].taxExclusive],['inclusive',D[lang].taxInclusive],['none',D[lang].taxNone]]],['invoice',D[lang].invoice,[['unknown',D[lang].unknown],['registered',D[lang].registered],['unregistered',D[lang].unregistered]]]]){const field=document.createElement('label');field.className='field';const span=document.createElement('span');span.textContent=label;const sel=document.createElement('select');for(const [v,t] of opts){const opt=document.createElement('option');opt.value=v;opt.textContent=t;sel.append(opt)}sel.value=w[key];sel.addEventListener('change',()=>updateWorker(w.id,key,sel.value));field.append(span,sel);grid.append(field)}box.append(grid);root.append(box)})}function setLang(l){lang=l;document.documentElement.lang=l==='ja'?'ja':'pt-BR';document.querySelectorAll('[data-i]').forEach(el=>el.textContent=D[l][el.dataset.i]);document.getElementById('pt').setAttribute('aria-pressed',l==='pt');document.getElementById('ja').setAttribute('aria-pressed',l==='ja');renderWorkers();calc()}function calc(){const q=D[lang],out=document.getElementById('output'),ids=['days','materials','toll','parking','fuel','otherDaily','fixed','margin','tax'];const invalid=ids.some(id=>document.getElementById(id).value===''||!Number.isFinite(val(id))||val(id)<0)||val('margin')>=100||val('tax')>100||workers.some(w=>(w.workerDays!==''&&(!Number.isFinite(Number(w.workerDays))||Number(w.workerDays)<0))||!Number.isFinite(Number(w.contractTax))||Number(w.contractTax)<0||Number(w.contractTax)>100||w.qty===''||w.rate==='' ||!Number.isInteger(Number(w.qty))||Number(w.qty)<0||!Number.isFinite(Number(w.rate))||Number(w.rate)<0);if(invalid){out.textContent=q.error;return}const days=val('days');let employee=0,external=0,externalTax=0;for(const w of workers){const d=w.workerDays===''?days:Number(w.workerDays),base=Number(w.qty)*Number(w.rate)*d;if(w.category==='employee'){employee+=base;continue}let total=base;if(w.taxMode==='exclusive'){total=base*(1+Number(w.contractTax)/100);externalTax+=total-base}else if(w.taxMode==='inclusive'){externalTax+=base*Number(w.contractTax)/(100+Number(w.contractTax))}external+=total}const labor=employee+external,daily=(val('toll')+val('parking')+val('fuel')+val('otherDaily'))*days,cost=labor+daily+val('materials')+val('fixed'),before=cost/(1-val('margin')/100),profit=before-cost,tax=before*val('tax')/100;out.replaceChildren();for(const [label,amount,highlight] of [[q.laborEmployee,employee],[q.laborOutsource,external],[q.taxContract,externalTax],[q.daily,daily],[q.materialsResult,val('materials')],[q.fixedResult,val('fixed')],[q.cost,cost],[q.before,before],[q.profit,profit],[q.taxResult,tax],[q.total,before+tax,true]]){const row=document.createElement('div');row.className='result-row'+(highlight?' total':'');const name=document.createElement('span');name.textContent=label;const number=document.createElement('strong');number.textContent=yen(amount);row.append(name,number);out.append(row)}}document.querySelectorAll('input[id]').forEach(el=>el.addEventListener('input',calc));addWorker('Eletricista',1,23000);addWorker('Ajudante',1,16000);setLang('pt');</script></body></html>
